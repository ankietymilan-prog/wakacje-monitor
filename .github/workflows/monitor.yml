name: Wakacje Monitor

on:
  schedule:
    # Co godzinę od 6:00 do 23:00 czasu polskiego (UTC+2 = UTC-2h)
    - cron: '0 4-21 * * *'
  workflow_dispatch:  # Możliwość ręcznego uruchomienia z GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Przywróć poprzedni stan ofert (cache między uruchomieniami)
      - name: Restore offers state
        uses: actions/cache@v4
        with:
          path: data/
          key: offers-state-${{ runner.os }}
          restore-keys: |
            offers-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run monitor
        env:
          EMAIL_FROM:      ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:        ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASS:  ${{ secrets.EMAIL_APP_PASS }}
          TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p data
          python main.py

      # Zapisz zaktualizowany stan do cache
      - name: Save offers state
        uses: actions/cache@v4
        if: always()
        with:
          path: data/
          key: offers-state-${{ runner.os }}-${{ github.run_id }}

      # Opcjonalnie: commituj CSV historii do repo (do analizy trendów cen)
      - name: Commit history CSV
        if: always()
        run: |
          git config user.name  "Wakacje Bot"
          git config user.email "bot@wakacje-monitor"
          git add data/offers_history.csv data/last_offers.json || true
          git diff --staged --quiet || git commit -m "📊 Update: $(date '+%Y-%m-%d %H:%M') — $(python -c "import json; d=json.load(open('data/last_offers.json')); print(str(d['count']) + ' ofert')" 2>/dev/null || echo 'brak danych')"
          git push || true
